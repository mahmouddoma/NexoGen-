<header 
  class="nexo-navbar" 
  [class.nexo-navbar--scrolled]="isScrolled()" 
  [class.nexo-navbar--menu-open]="isMobileMenuOpen()"
  aria-label="Main Site Navigation">

  <div class="navbar-container">
    
    <!-- Brand Logo Lockup -->
    <a 
      routerLink="/" 
      fragment="home" 
      (click)="onNavClick('home', $event)" 
      class="navbar-brand" 
      aria-label="NexoGen Pharma Homepage">
      <div class="brand-logo-wrapper">
        <img 
          src="assets/branding/nexogen-logo.png" 
          alt="NexoGen Pharma" 
          class="navbar-logo-img" 
          width="61" 
          height="52"
          fetchpriority="high"
        />
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Desktop Primary Navigation">
      <ul class="nav-links">
        @for (item of navItems; track item.id) {
          <li class="nav-item">
            <a 
              routerLink="/" 
              [fragment]="item.id"
              class="nav-link"
              [class.nav-link--active]="activeSection() === item.id"
              [attr.aria-current]="activeSection() === item.id ? 'page' : null"
              (click)="onNavClick(item.id, $event)">
              <span>{{ item.key | translate }}</span>
              <span class="active-indicator" aria-hidden="true"></span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Desktop Right Action -->
    <div class="navbar-actions">
      <app-language-switcher />

      <a 
        routerLink="/" 
        fragment="contact" 
        (click)="onNavClick('contact', $event)" 
        class="nav-cta-btn"
        [attr.aria-label]="'NAV.GET_IN_TOUCH' | translate">
        <span>{{ 'NAV.GET_IN_TOUCH' | translate }}</span>
        <svg class="cta-arrow" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 10H16M16 10L10 4M16 10L10 16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

  </div>

</header>

<!-- =========================================================================
     Floating Bottom Navigation Dock (Always Floating from bottom, Image 2 style)
     ========================================================================= -->
<nav class="nexo-floating-dock" aria-label="Floating Primary Navigation">
  <ul class="dock-items">
    @for (item of navItems; track item.id) {
      <li class="dock-item">
        <a 
          routerLink="/" 
          [fragment]="item.id"
          class="dock-link"
          [class.dock-link--active]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'page' : null"
          (click)="onNavClick(item.id, $event)">
          <span class="dock-icon-wrapper" aria-hidden="true">
            <i [class]="item.faIcon"></i>
          </span>
          <span class="dock-label">{{ item.key | translate }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
